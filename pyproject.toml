[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartscope-retention"
version = "0.1.0"
description = "Reproducible customer retention analysis for retail transaction data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
cartscope = "cartscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cartscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
